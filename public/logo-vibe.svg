<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <!-- Simbol: doua linii elegante care formeaza V + abur de cafea -->
  <line x1="20" y1="8" x2="40" y2="38" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="8" x2="40" y2="38" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>
  <!-- Linie orizontala subtire sub V -->
  <line x1="20" y1="44" x2="60" y2="44" stroke="#f59e0b" stroke-width="0.8" opacity="0.6"/>
  <!-- Text VIBE -->
  <text x="72" y="28" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="3">VIBE</text>
  <!-- Text CAFFE mai mic sub VIBE -->
  <text x="72" y="44" font-family="Georgia, serif" font-size="11" fill="#fcd34d" letter-spacing="5">CAFFÈ</text>
  <!-- Linie decorativa dreapta -->
  <line x1="72" y1="50" x2="178" y2="50" stroke="#f59e0b" stroke-width="0.5" opacity="0.4"/>
</svg>
